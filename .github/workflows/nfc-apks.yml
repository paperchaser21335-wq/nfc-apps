          cat << 'EOF' > workdir/wallet/src/main/java/com/custompay/wallet/SecureCardStore.kt
          package com.custompay.wallet

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import org.json.JSONObject
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          object SecureCardStore {
              private const val KEY_ALIAS = "WalletHardwareKey"
              private const val PREFS = "wallet_vault"

              private fun getSecretKey(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  val existing = ks.getEntry(KEY_ALIAS, null) as? KeyStore.SecretKeyEntry
                  if (existing != null) return existing.secretKey

                  val kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  kg.init(
                      KeyGenParameterSpec.Builder(
                          KEY_ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                      )
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .build()
                  )
                  return kg.generateKey()
              }

              fun saveCard(
                  context: Context,
                  accountNumber: String,
                  expiry: String,
                  cvv: String,
                  billingAddress: String
              ) {
                  val json = JSONObject().apply {
                      put("pan", accountNumber.trim().take(19))
                      put("exp", expiry.trim().take(7))
                      put("cvv", cvv.trim().take(4))
                      put("addr", billingAddress.trim().take(80))
                  }.toString()

                  val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                  cipher.init(Cipher.ENCRYPT_MODE, getSecretKey())
                  val encrypted = cipher.doFinal(json.toByteArray(Charsets.UTF_8))

                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putString("iv", Base64.encodeToString(cipher.iv, Base64.NO_WRAP))
                      .putString("data", Base64.encodeToString(encrypted, Base64.NO_WRAP))
                      .putBoolean("armed", true)
                      .apply()
              }

              fun loadCardJson(context: Context): String? {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val ivStr = prefs.getString("iv", null) ?: return null
                  val dataStr = prefs.getString("data", null) ?: return null
                  return try {
                      val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                      val spec = GCMParameterSpec(128, Base64.decode(ivStr, Base64.NO_WRAP))
                      cipher.init(Cipher.DECRYPT_MODE, getSecretKey(), spec)
                      val plain = cipher.doFinal(Base64.decode(dataStr, Base64.NO_WRAP))
                      String(plain, Charsets.UTF_8)
                  } catch (e: Exception) {
                      null
                  }
              }

              fun isArmed(context: Context): Boolean =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean("armed", false)

              fun setArmed(context: Context, armed: Boolean) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putBoolean("armed", armed)
                      .apply()
              }

              fun clear(context: Context) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().clear().apply()
              }

              fun getSummary(context: Context): String {
                  val raw = loadCardJson(context) ?: return "No card saved."
                  return try {
                      val obj = JSONObject(raw)
                      val pan = obj.optString("pan", "")
                      val addr = obj.optString("addr", "")
                      val state = if (isArmed(context)) "ARMED (Ready to Tap)" else "PAUSED"
                      "Status: $state\nActive Card: **** ${pan.takeLast(4)}\nBilling: $addr"
                  } catch (e: Exception) {
                      "No card saved."
                  }
              }
          }
          EOF

          cat << 'EOF' > workdir/wallet/src/main/java/com/custompay/wallet/CardEmulationService.kt
          package com.custompay.wallet

          import android.content.Intent
          import android.nfc.cardemulation.HostApduService
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator

          class CardEmulationService : HostApduService() {
              private fun hexToBytes(hex: String): ByteArray =
                  ByteArray(hex.length / 2) { i -> hex.substring(i * 2, i * 2 + 2).toInt(16).toByte() }

              private val selectAidPrefix = hexToBytes("00A404000AF0435553544F4D504159")
              private val swOk = hexToBytes("9000")
              private val swNotFound = hexToBytes("6A82")
              private val swUnknown = hexToBytes("6F00")

              override fun processCommandApdu(commandApdu: ByteArray?, extras: Bundle?): ByteArray {
                  if (commandApdu == null || commandApdu.size < selectAidPrefix.size) {
                      return swUnknown
                  }
                  val header = commandApdu.sliceArray(0 until selectAidPrefix.size)
                  if (!header.contentEquals(selectAidPrefix)) {
                      return swUnknown
                  }
                  if (!SecureCardStore.isArmed(applicationContext)) {
                      return swNotFound
                  }
                  val cardJson = SecureCardStore.loadCardJson(applicationContext) ?: return swNotFound
                  val payload = cardJson.toByteArray(Charsets.UTF_8)

                  try {
                      getSystemService(Vibrator::class.java)?.vibrate(
                          VibrationEffect.createOneShot(120, VibrationEffect.DEFAULT_AMPLITUDE)
                      )
                  } catch (_: Exception) {
                  }
                  sendBroadcast(Intent("com.custompay.wallet.TAP_SENT").setPackage(packageName))
                  return payload + swOk
              }

              override fun onDeactivated(reason: Int) {}
          }
          EOF

          cat << 'EOF' > workdir/wallet/src/main/java/com/custompay/wallet/WalletActivity.kt
          package com.custompay.wallet

          import android.app.Activity
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.Typeface
          import android.nfc.NfcAdapter
          import android.nfc.cardemulation.CardEmulation
          import android.os.Build
          import android.os.Bundle
          import android.text.InputType
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class WalletActivity : Activity() {
              private lateinit var statusView: TextView

              private val tapReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      Toast.makeText(this@WalletActivity, "NFC Payment Data Sent!", Toast.LENGTH_SHORT).show()
                      refreshStatus()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val density = resources.displayMetrics.density
                  fun dp(v: Int) = (v * density).toInt()

                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.WHITE) }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(20), dp(20), dp(20))
                  }

                  val title = TextView(this).apply {
                      text = "NFC Card Wallet"
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.BLACK)
                  }

                  statusView = TextView(this).apply {
                      textSize = 15f
                      setTextColor(Color.DKGRAY)
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      setBackgroundColor(Color.parseColor("#F1F5F9"))
                  }

                  val panInput = EditText(this).apply {
                      hint = "Account / Card Number (Digits)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setTextColor(Color.BLACK)
                  }

                  val expInput = EditText(this).apply {
                      hint = "Expiration MM/YY (Optional)"
                      inputType = InputType.TYPE_CLASS_DATETIME
                      setTextColor(Color.BLACK)
                  }

                  val cvvInput = EditText(this).apply {
                      hint = "CVV (Optional)"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setTextColor(Color.BLACK)
                  }

                  val addrInput = EditText(this).apply {
                      hint = "Billing Street Address & ZIP"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_POSTAL_ADDRESS
                      setTextColor(Color.BLACK)
                  }

                  val saveBtn = Button(this).apply {
                      text = "Save & Arm Card for NFC Tap"
                      setOnClickListener {
                          val pan = panInput.text.toString().filter { it.isDigit() }
                          val addr = addrInput.text.toString().trim()
                          if (pan.length < 4 || addr.isEmpty()) {
                              Toast.makeText(
                                  this@WalletActivity,
                                  "Enter at least a 4+ digit account number and billing address.",
                                  Toast.LENGTH_LONG
                              ).show()
                              return@setOnClickListener
                          }
                          SecureCardStore.saveCard(
                              this@WalletActivity,
                              pan,
                              expInput.text.toString(),
                              cvvInput.text.toString(),
                              addr
                          )
                          panInput.text.clear()
                          expInput.text.clear()
                          cvvInput.text.clear()
                          addrInput.text.clear()
                          refreshStatus()
                          Toast.makeText(this@WalletActivity, "Card encrypted & armed for NFC!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val toggleBtn = Button(this).apply {
                      text = "Pause / Resume NFC Broadcasting"
                      setOnClickListener {
                          val next = !SecureCardStore.isArmed(this@WalletActivity)
                          SecureCardStore.setArmed(this@WalletActivity, next)
                          refreshStatus()
                      }
                  }

                  val clearBtn = Button(this).apply {
                      text = "Delete Saved Card"
                      setOnClickListener {
                          SecureCardStore.clear(this@WalletActivity)
                          refreshStatus()
                      }
                  }

                  listOf(title, statusView, panInput, expInput, cvvInput, addrInput, saveBtn, toggleBtn, clearBtn).forEach { view ->
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = dp(12) }
                      root.addView(view, lp)
                  }

                  scroll.addView(root)
                  setContentView(scroll)
                  refreshStatus()
              }

              private fun refreshStatus() {
                  val nfc = NfcAdapter.getDefaultAdapter(this)
                  val nfcState = when {
                      nfc == null -> "NFC Hardware: Not supported on this phone"
                      !nfc.isEnabled -> "NFC Radio: OFF (Turn on NFC in Android Settings)"
                      else -> "NFC Radio: ON (Keep screen awake & hold back-to-back with Terminal)"
                  }
                  statusView.text = "$nfcState\n\n${SecureCardStore.getSummary(this)}"
              }

              @Suppress("UnspecifiedRegisterReceiverFlag")
              override fun onResume() {
                  super.onResume()
                  refreshStatus()
                  try {
                      val adapter = NfcAdapter.getDefaultAdapter(this)
                      if (adapter != null && adapter.isEnabled) {
                          CardEmulation.getInstance(adapter).setPreferredService(
                              this,
                              ComponentName(this, CardEmulationService::class.java)
                          )
                      }
                  } catch (_: Exception) {
                  }
                  val filter = IntentFilter("com.custompay.wallet.TAP_SENT")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(tapReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(tapReceiver, filter)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  try {
                      val adapter = NfcAdapter.getDefaultAdapter(this)
                      if (adapter != null) {
                          CardEmulation.getInstance(adapter).unsetPreferredService(this)
                      }
                  } catch (_: Exception) {
                  }
                  try {
                      unregisterReceiver(tapReceiver)
                  } catch (_: Exception) {
                  }
              }
          }
          EOF

          cat << 'EOF' > workdir/terminal/build.gradle.kts
