          cat << 'EOF' > workdir/terminal/src/main/java/com/custompay/terminal/TerminalActivity.kt
          package com.custompay.terminal

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.Typeface
          import android.nfc.NfcAdapter
          import android.nfc.Tag
          import android.nfc.tech.IsoDep
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.text.InputType
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class TerminalActivity : Activity() {
              private var nfcAdapter: NfcAdapter? = null
              private lateinit var logView: TextView
              private lateinit var armBtn: Button
              private lateinit var amountInput: EditText
              private lateinit var webhookInput: EditText

              @Volatile private var readerArmed = false
              @Volatile private var activeAmount = "15.00"
              @Volatile private var activeWebhook = ""

              private fun hexToBytes(hex: String): ByteArray =
                  ByteArray(hex.length / 2) { i -> hex.substring(i * 2, i * 2 + 2).toInt(16).toByte() }

              private val selectApdu = hexToBytes("00A404000AF0435553544F4D50415900")

              private val readerCallback = NfcAdapter.ReaderCallback { tag: Tag ->
                  if (!readerArmed) return@ReaderCallback
                  handleTag(tag)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  nfcAdapter = NfcAdapter.getDefaultAdapter(this)
                  val density = resources.displayMetrics.density
                  fun dp(v: Int) = (v * density).toInt()

                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.WHITE) }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(20), dp(20), dp(20))
                  }

                  val title = TextView(this).apply {
                      text = "NFC Payment Terminal"
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.BLACK)
                  }

                  amountInput = EditText(this).apply {
                      hint = "Charge Amount USD (e.g. 15.00)"
                      setText("15.00")
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                      setTextColor(Color.BLACK)
                  }

                  webhookInput = EditText(this).apply {
                      hint = "Optional Payment Webhook URL (Blank = Local POS Approval)"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                      setTextColor(Color.BLACK)
                  }

                  armBtn = Button(this).apply {
                      text = "Charge: Tap Customer Phone"
                      setOnClickListener {
                          if (readerArmed) {
                              stopReader("Terminal idle.")
                          } else {
                              startReader()
                          }
                      }
                  }

                  logView = TextView(this).apply {
                      text = "Enter an amount and tap 'Charge' to activate NFC reader."
                      textSize = 15f
                      setTextColor(Color.DKGRAY)
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      setBackgroundColor(Color.parseColor("#F1F5F9"))
                  }

                  listOf(title, amountInput, webhookInput, armBtn, logView).forEach { view ->
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = dp(12) }
                      root.addView(view, lp)
                  }

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun startReader() {
                  val adapter = nfcAdapter
                  if (adapter == null || !adapter.isEnabled) {
                      logView.text = "Turn ON NFC in Android Settings on this Terminal phone first."
                      return
                  }
                  activeAmount = amountInput.text.toString().trim().ifEmpty { "1.00" }
                  activeWebhook = webhookInput.text.toString().trim()
                  readerArmed = true
                  armBtn.text = "Cancel NFC Charge"
                  logView.text = "WAITING FOR TAP...\nAmount: USD $activeAmount\nHold unlocked Wallet phone back-to-back."

                  adapter.enableReaderMode(
                      this,
                      readerCallback,
                      NfcAdapter.FLAG_READER_NFC_A or NfcAdapter.FLAG_READER_SKIP_NDEF_CHECK,
                      null
                  )
              }

              private fun stopReader(message: String? = null) {
                  readerArmed = false
                  runOnUiThread {
                      try {
                          nfcAdapter?.disableReaderMode(this)
                      } catch (_: Exception) {
                      }
                      armBtn.text = "Charge: Tap Customer Phone"
                      if (message != null) logView.text = message
                  }
              }

              private fun handleTag(tag: Tag) {
                  val isoDep = IsoDep.get(tag) ?: run {
                      postLog("Unsupported NFC device.")
                      return
                  }
                  try {
                      isoDep.connect()
                      isoDep.timeout = 5000
                      val response = isoDep.transceive(selectApdu)
                      isoDep.close()

                      if (response.size < 2) {
                          postLog("Incomplete NFC read. Hold phones steady together.")
                          return
                      }
                      val sw1 = response[response.size - 2].toInt() and 0xFF
                      val sw2 = response[response.size - 1].toInt() and 0xFF
                      if (sw1 != 0x90 || sw2 != 0x00) {
                          postLog("DECLINED (Code %02X%02X): No armed card on Wallet phone.".format(sw1, sw2))
                          return
                      }

                      val card = JSONObject(String(response, 0, response.size - 2, Charsets.UTF_8))
                      try {
                          getSystemService(Vibrator::class.java)?.vibrate(
                              VibrationEffect.createOneShot(180, VibrationEffect.DEFAULT_AMPLITUDE)
                          )
                      } catch (_: Exception) {
                      }
                      processPayment(card)
                  } catch (e: Exception) {
                      postLog("NFC Read Error: ${e.message ?: "Hold phones steady."}")
                  }
              }

              private fun processPayment(card: JSONObject) {
                  val pan = card.optString("pan", "")
                  val exp = card.optString("exp", "")
                  val cvv = card.optString("cvv", "")
                  val addr = card.optString("addr", "")
                  val stamp = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())

                  if (activeWebhook.isEmpty()) {
                      val receipt = "APPROVED (LOCAL POS)\n" +
                          "Amount: USD $activeAmount\n" +
                          "Card: **** ${pan.takeLast(4)}\n" +
                          "Billing: $addr\n" +
                          "Time: $stamp"
                      stopReader(receipt)
                      return
                  }

                  postLog("Card read (**** ${pan.takeLast(4)}). Contacting payment gateway...")
                  try {
                      val payload = JSONObject().apply {
                          put("amount", activeAmount)
                          put("accountNumber", pan)
                          put("exp", exp)
                          put("cvv", cvv)
                          put("billingAddress", addr)
                          put("timestamp", stamp)
                      }.toString()

                      val conn = (URL(activeWebhook).openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          connectTimeout = 10000
                          readTimeout = 10000
                          doOutput = true
                          setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      }
                      OutputStreamWriter(conn.outputStream, Charsets.UTF_8).use { it.write(payload) }

                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val body = stream?.let {
                          BufferedReader(InputStreamReader(it, Charsets.UTF_8)).use { r -> r.readText() }
                      } ?: ""

                      val verdict = if (code in 200..299) "APPROVED (GATEWAY $code)" else "DECLINED (HTTP $code)"
                      val receipt = "$verdict\nAmount: USD $activeAmount\nCard: **** ${pan.takeLast(4)}\nBilling: $addr\nGateway Response: ${body.take(200)}"
                      stopReader(receipt)
                  } catch (e: Exception) {
                      stopReader("GATEWAY ERROR: ${e.message}")
                  }
              }

              private fun postLog(msg: String) {
                  runOnUiThread { logView.text = msg }
              }

              override fun onPause() {
                  super.onPause()
                  if (readerArmed) stopReader()
              }
          }
          EOF

          gradle -p workdir assembleDebug --no-daemon --stacktrace
          cp workdir/wallet/build/outputs/apk/debug/wallet-debug.apk dist/NfcWallet.apk
          cp workdir/terminal/build/outputs/apk/debug/terminal-debug.apk dist/NfcTerminal.apk
          ls -lh dist/*.apk

      - name: Upload Ready-to-Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: NfcPayment-APKs
          path: dist/*.apk
