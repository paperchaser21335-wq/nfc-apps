name: Build Ready APKs v2

on:
  push:
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install SDK, Generate Apps, and Compile APKs
        run: |
          set +o pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME" "$HOME/.android"

          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            $(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null) \
            $(command -v sdkmanager 2>/dev/null); do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          set -eo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp/gradle-dist
          export PATH="/tmp/gradle-dist/gradle-8.7/bin:$PATH"

          mkdir -p workdir/wallet/src/main/java/com/custompay/wallet
          mkdir -p workdir/wallet/src/main/res/values
          mkdir -p workdir/wallet/src/main/res/xml
          mkdir -p workdir/terminal/src/main/java/com/custompay/terminal
          mkdir -p dist

          printf "sdk.dir=%s\n" "$ANDROID_HOME" > workdir/local.properties

          cat << 'EOF' > workdir/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NfcPaymentSuite"
          include(":wallet", ":terminal")
          EOF

          cat << 'EOF' > workdir/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > workdir/build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > workdir/wallet/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.custompay.wallet"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.custompay.wallet"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          EOF

          cat << 'EOF' > workdir/wallet/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NFC Wallet</string>
              <string name="service_desc">Custom NFC Payment Card Service</string>
              <string name="aid_group_desc">Custom NFC Payment AID</string>
          </resources>
          EOF

          cat << 'EOF' > workdir/wallet/src/main/res/xml/apduservice.xml
          <?xml version="1.0" encoding="utf-8"?>
          <host-apdu-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/service_desc"
              android:requireDeviceUnlock="false">
              <aid-group
                  android:category="other"
                  android:description="@string/aid_group_desc">
                  <aid-filter android:name="F0435553544F4D504159" />
              </aid-group>
          </host-apdu-service>
